<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frostn — Coming soon</title>
<meta name="description" content="Frostn Design. Our own website is late. Classic. Follow @frostndesign while we fix the kerning.">
<meta property="og:title" content="Frostn — Our own website is late. Classic.">
<meta property="og:description" content="New site coming soon. Meanwhile: @frostndesign on Instagram.">
<meta name="theme-color" content="#0C3EFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0C3EFF;--yellow:#F8D400;--orange:#FF5300;--green:#009C53;--paper:#F6F6E9;--ink:#161616;
  --display:'Bricolage Grotesque',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
body{background:var(--blue);color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow-x:clip;-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(18px,4vw,48px);position:relative}
.logo{background:none;border:0;cursor:pointer;padding:0;transform-origin:left center;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.logo svg{width:clamp(120px,13vw,160px);height:auto;display:block}
.status{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 14px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}

main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px clamp(18px,6vw,96px) 48px;max-width:1300px;width:100%;margin:0 auto}
h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,9.5vw,150px);line-height:.88;letter-spacing:-.04em;text-transform:uppercase;color:#fff}

.loader{margin-top:clamp(28px,5vh,48px);max-width:560px;cursor:pointer;user-select:none}
.loader-top{display:flex;justify-content:space-between;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.bar{height:26px;border-radius:999px;background:rgba(0,0,0,.25);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.fill{height:100%;width:99%;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#FFE24D 14px 28px);background-size:40px 40px;
  border-right:2.5px solid var(--ink);animation:stripes 1s linear infinite;transition:width .5s}
@keyframes stripes{to{background-position:40px 0}}
.why{margin-top:10px;font-size:15px;min-height:22px;color:rgba(255,255,255,.8)}

.ctas{margin-top:30px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;min-height:64px}
.btn{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;color:var(--ink);
  display:inline-flex;align-items:center;gap:10px;padding:17px 26px;border-radius:999px;border:2.5px solid var(--ink);cursor:pointer;
  box-shadow:4px 4px 0 var(--ink);white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.ig{background:var(--yellow)}
.ig:hover{background:#FFE24D;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.ig svg{width:20px;height:20px}
#run{background:var(--paper);transition:left .2s cubic-bezier(.3,1.5,.5,1),top .2s cubic-bezier(.3,1.5,.5,1),background .2s}
#run.loose{position:fixed;z-index:30}
#run.wig{animation:wig .45s}
@keyframes wig{25%{transform:rotate(-7deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
#run.done{background:var(--orange);cursor:default}
.tries{font-family:var(--display);font-weight:700;font-size:13px;color:rgba(255,255,255,.6);width:100%;min-height:18px}

.checker{height:22px;border-top:3px solid var(--ink);background:conic-gradient(var(--paper) 25%,var(--blue) 0 50%,var(--paper) 0 75%,var(--blue) 0) 0 0/22px 22px}
footer{background:var(--ink);color:rgba(255,255,255,.7);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px clamp(18px,4vw,48px);font-size:14px}
footer a{color:#fff;text-decoration:none}
footer a:hover{color:var(--yellow)}
.bit{position:fixed;pointer-events:none;z-index:50;width:12px;height:12px;border:2px solid var(--ink)}

@media (max-width:600px){ .status{display:none} .btn{font-size:15px;padding:15px 22px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <button class="logo" id="logo" aria-label="Frostn logo. Click to make it bigger.">
    <svg viewBox="100 100 1200 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frostn">
      <path d="M182.456 191.616V191.77C182.456 195.55 185.567 198.661 189.347 198.661H260.154V252.55H179.345V318.189H100.645V105.691H294.323V147.496C294.323 168.116 277.612 183.491 257.017 183.491H189.244C185.953 183.491 183.151 185.908 182.585 189.045C182.508 189.456 182.456 191.204 182.456 191.59V191.616Z" fill="#fff"/>
      <path d="M495.221 209.329V176.342C495.298 137.468 463.776 105.895 424.902 105.895H308.047V318.393H386.439V259.233C386.439 254.708 391.375 250.954 396.055 252.831C398.703 253.937 400.245 256.765 400.245 259.593V318.368H488.664V283.864C488.664 263.99 479.614 247.715 460.048 246.609C479.614 245.478 495.195 229.203 495.195 209.329H495.221ZM423.745 186.061C423.745 194.468 418.963 198.53 410.581 198.53H386.593V171.251H410.581C418.988 171.251 423.796 176.471 423.745 184.904V186.061Z" fill="#fff"/>
      <path d="M644.938 100.031H578.502C539.653 100.031 508.157 131.527 508.157 170.401V253.549C508.157 292.424 539.653 323.919 578.502 323.919H644.938C683.787 323.919 715.282 292.424 715.282 253.549V170.401C715.282 131.527 683.787 100.031 644.938 100.031Z" fill="#fff"/>
      <g id="spark" style="transform-origin:611.7px 211.6px;transform-box:view-box"><path d="M562.534 196.629L576.958 171.947L608.402 199.38L610.279 198.866L613.698 156.803L641.98 162.588L624.908 202.208L626.296 203.339L665.711 192.721L668.539 221.131L627.813 218.509L626.708 220.231L651.236 255.378L624.651 266.639L613.004 226.376L611.384 226.196L586.085 260.288L567.085 239.231L601.306 214.806L601.126 212.904L562.534 196.68V196.629Z" fill="#0C3EFF"/></g>
      <path d="M1299.33 176.188V318.266H1213.66V233.883C1213.66 231.029 1212.22 228.201 1209.75 227.121C1205.43 225.193 1200.81 228.972 1200.81 233.523V318.266L1117.17 318.42V105.741H1177.56L1178.67 170.018C1178 169.375 1159.33 171.766 1159.33 171.766C1160.23 154.36 1175.58 128.984 1189.62 115.974C1198.98 108.364 1208.44 104.404 1221.89 103.299H1233.95C1270.07 103.299 1299.35 137.262 1299.35 176.163H1299.33V176.188Z" fill="#fff"/>
      <path d="M1069.34 318.418H957.551L974.88 183.514H923.433V105.739H1103.48V183.488H1051.99L1069.37 318.392L1069.34 318.418Z" fill="#fff"/>
      <path d="M841.903 187.632C840.129 192.286 842.648 199.151 847.842 198.585H854.578C884.942 198.585 909.573 211.62 909.573 244.299V259.185C909.573 291.889 884.968 318.371 854.578 318.371H729.47V240.082H790.919C793.567 240.082 796.189 238.257 797.218 235.608C798.992 230.955 796.781 224.913 791.278 224.913H784.491C754.127 224.913 729.496 211.877 729.496 179.199V164.904C729.496 132.2 754.101 105.718 784.491 105.718H909.599V183.39H848.202C845.554 183.39 842.931 184.933 841.903 187.581V187.632Z" fill="#fff"/>
    </svg>
  </button>
  <div class="status"><span class="dot"></span><span id="statusTxt">Status: fixing the kerning</span></div>
</header>

<main>
  <h1>Our own website<br>is late. Classic.</h1>

  <div class="loader" id="loader" role="button" tabindex="0" aria-label="Website loading bar. Click it.">
    <div class="loader-top"><span>Website loading</span><span id="pct">99%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="why" id="why">Stuck because: client said "bas ek chhota sa change"</p>
  </div>

  <div class="ctas">
    <a class="btn ig" id="ig" href="https://www.instagram.com/frostndesign/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg>
      Follow @frostndesign
    </a>
    <button class="btn" id="run">See the website</button>
    <p class="tries" id="tries"></p>
  </div>
</main>

<div class="checker"></div>
<footer>
  <span>© Frostn Design</span>
  <span><a href="mailto:frostn.studio@gmail.com">frostn.studio@gmail.com</a> &nbsp;·&nbsp; <a href="https://www.instagram.com/frostndesign/" target="_blank" rel="noopener">@frostndesign</a></span>
</footer>

<script>
{
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* loading bar that never finishes */
  const reasons = [
    'client said "bas ek chhota sa change"',
    'designer is moving it 1px to the left',
    'picking between two identical blues',
    'someone asked for Comic Sans',
    'chai break. Non-negotiable.',
    'client is "checking with the team"'
  ];
  let ri = 0, nines = 0;
  const bump = () => {
    nines++;
    $('#pct').textContent = '99.' + '9'.repeat(Math.min(nines, 6)) + '%';
    $('#fill').style.width = (99 + Math.min(.95, nines * .16)) + '%';
    if (nines >= 6) { $('#why').textContent = 'It will never hit 100. Follow us on Instagram instead.'; return; }
    ri = (ri + 1) % reasons.length; $('#why').textContent = 'Stuck because: ' + reasons[ri];
  };
  $('#loader').addEventListener('click', bump);
  $('#loader').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(); } });
  setInterval(() => { if (nines < 6) { ri = (ri + 1) % reasons.length; $('#why').textContent = 'Stuck because: ' + reasons[ri]; } }, 4200);

  /* the website button runs away; Instagram stays put */
  const run = $('#run'), tries = $('#tries');
  const lines = ["Nope", "Not here", "Try left", "Too slow", "Arre ruko!", "Kerning check",
    "Client call, 2 min", "Almost!", "Website loading", "Bas ek aur try", "Seriously?",
    "Okay you're fast", "Thak gaya yaar", "Last one, promise"];
  let n = 0, done = false;
  function dodge(e) {
    if (done) return;
    if (e) e.preventDefault();
    n++;
    if (n > lines.length) { finish(); return; }
    run.textContent = lines[n - 1];
    tries.textContent = `Tries: ${n}`;
    const r = run.getBoundingClientRect(), pad = 16;
    const ig = $('#ig').getBoundingClientRect();
    let x, y, k = 0;
    do {
      x = pad + Math.random() * Math.max(0, innerWidth - r.width - pad * 2);
      y = pad + 70 + Math.random() * Math.max(0, innerHeight - r.height - pad * 2 - 70);
      k++;
    } while ((Math.hypot(x - r.left, y - r.top) < Math.min(240, innerWidth / 3) ||
             (x < ig.right + 10 && x + r.width > ig.left - 10 && y < ig.bottom + 10 && y + r.height > ig.top - 10)) && k < 40);
    if (!run.classList.contains('loose')) {
      run.classList.add('loose'); run.style.left = r.left + 'px'; run.style.top = r.top + 'px'; void run.offsetWidth;
    }
    run.style.left = x + 'px'; run.style.top = y + 'px';
    run.classList.remove('wig'); void run.offsetWidth; run.classList.add('wig');
  }
  function finish() {
    done = true;
    run.classList.remove('loose'); run.style.left = ''; run.style.top = '';
    run.classList.add('done'); run.textContent = 'Coming soon. Promise.';
    tries.textContent = `You tried ${n - 1} times. Respect. Now follow us.`;
    const b = $('#ig').getBoundingClientRect(); confetti(b.left + b.width / 2, b.top + b.height / 2);
  }
  run.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(e); });
  run.addEventListener('click', dodge);

  /* make the logo bigger */
  const logo = $('#logo'); let li = 0;
  logo.addEventListener('click', () => { li = (li + 1) % 5; logo.style.transform = `scale(${1 + li * .3})`; });
  logo.addEventListener('pointerenter', () => { if (!reduce) $('#spark').animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}], {duration:700, easing:'cubic-bezier(.3,1.4,.5,1)'}); });

  /* status ticker */
  const st = ["fixing the kerning", "on a quick call (2 hrs)", "exporting at 4x", "renaming layers", "making it pop"];
  let si = 0; setInterval(() => { si = (si + 1) % st.length; $('#statusTxt').textContent = 'Status: ' + st[si]; }, 3000);

  /* confetti */
  function confetti(x, y) {
    if (reduce) return;
    const cols = ['#F8D400', '#FF5300', '#009C53', '#F6F6E9'];
    for (let i = 0; i < 40; i++) {
      const b = document.createElement('i'); b.className = 'bit';
      b.style.background = cols[i % cols.length]; b.style.left = x + 'px'; b.style.top = y + 'px';
      b.style.borderRadius = i % 3 ? '3px' : '50%';
      document.body.appendChild(b);
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 240;
      b.animate([
        {transform:'translate(0,0) rotate(0)', opacity:1},
        {transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v-80}px) rotate(${Math.random()*720}deg)`, opacity:1, offset:.7},
        {transform:`translate(${Math.cos(a)*v*1.1}px,${Math.sin(a)*v+170}px) rotate(${Math.random()*900}deg)`, opacity:0}
      ], {duration:1100 + Math.random() * 500, easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => b.remove();
    }
  }
  $('#ig').addEventListener('click', e => confetti(e.clientX, e.clientY));
}
</script>
</body>
</html>
